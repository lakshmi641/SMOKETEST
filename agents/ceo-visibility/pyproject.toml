[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ceo-visibility-agent"
version = "0.1.0"
description = "CEO Visibility Agent - Agno agent for executive insights via Firestore + Cognee knowledge"
requires-python = ">=3.12"
authors = [
    {name = "Julley Platform", email = "platform@julley.com"}
]

dependencies = [
    "agno[postgres]>=2.5.5",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "firebase-admin>=6.5.0",
    "redis>=5.0.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.4.0",
    "python-dateutil>=2.9.0",
    "tenacity>=8.3.1",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.2.0",
]
