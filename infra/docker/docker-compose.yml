services:
  # ============================================================================
  # PostgreSQL with pgvector extension
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cognee_postgres
    environment:
      POSTGRES_USER: cognee_user
      POSTGRES_PASSWORD: cognee_password_dev
      POSTGRES_DB: agent_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognee_user -d agent_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentic

  # ============================================================================
  # Redis Stack (vector cache + session memory)
  # ============================================================================
  redis:
    image: redis/redis-stack:latest
    container_name: cognee_redis
    environment:
      REDIS_PASSWORD: redis_password_dev
    ports:
      - "6379:6379"
      - "8001:8001" 
    volumes:
      - redis_data:/data
    command: redis-server --requirepass redis_password_dev
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password_dev", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentic

  # ============================================================================
  # Ollama (Local LLM Engine)
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: cognee_ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - agentic

  # ============================================================================
  # LiteLLM Proxy (Model Router)
  # ============================================================================
  litellm:
    image: litellm/litellm:latest
    container_name: cognee_litellm
    ports:
      - "8000:8000"
    env_file:
      - ../../agents/ceo-visibility/.env
    environment:
      - LITELLM_MASTER_KEY=sk-litellm-dev-key
      - LOG_LEVEL=debug
    volumes:
      - ./litellm_config.yml:/app/config.yml:ro
    command: --config /app/config.yml --port 8000
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health/readiness\")' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - agentic

  # ============================================================================
  # Cognee API Service - FIXED VALIDATION & MODULE ERRORS
  # ============================================================================
  cognee:
    build:
      context: ./cognee
      dockerfile: Dockerfile
    container_name: cognee_api
    ports:
      - "8080:8000"
    environment:
      COGNEE_DB_HOST: postgres
      COGNEE_DB_PORT: 5432
      COGNEE_DB_NAME: agent_db
      COGNEE_DB_USER: cognee_user
      COGNEE_DB_PASSWORD: cognee_password_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_password_dev
      REDIS_DB: 0
      LITELLM_URL: http://litellm:8000
      LITELLM_API_KEY: sk-litellm-dev-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_started
    volumes:
      - ./cognee:/app
    networks:
      - agentic

  # ============================================================================
  # CEO Agent Service - FIXED PYTHONPATH & IMPORT ERRORS
  # ============================================================================
  ceo-agent:
    build:
      context: ../../agents/ceo-visibility
      dockerfile: Dockerfile
    container_name: ceo_agent
    user: root
    ports:
      - "8081:8000"
    working_dir: /app/src
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    env_file:
      - ../../agents/ceo-visibility/.env
    environment:
      - PYTHONPATH=/root/.local/lib/python3.12/site-packages
      - COGNEE_API_URL=http://cognee:8000
      - LITELLM_URL=http://litellm:8000
      - LITELLM_API_KEY=sk-litellm-dev-key
      - DATABASE_URL=postgresql://cognee_user:cognee_password_dev@postgres:5432/agent_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis_password_dev
    depends_on:
      cognee:
        condition: service_healthy
      litellm:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ../../agents/ceo-visibility:/app
    networks:
      - agentic

networks:
  agentic:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ollama_data: